name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: cmd
        run: |
          cd HyperSense
          build.bat

      - name: Verify binary
        shell: pwsh
        run: |
          $exe = "HyperSense64.exe"
          if (-not (Test-Path $exe)) { throw "build produced no executable" }
          $item = Get-Item $exe
          $info = $item.VersionInfo
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "size      : {0} bytes" -f $item.Length
          "version   : {0}" -f $info.FileVersion
          "company   : {0}" -f $info.CompanyName
          "sha256    : {0}" -f $hash
          if ($item.Length -lt 500000) { throw "binary looks truncated" }
          if ($info.CompanyName -ne "HYPERSENSEGLOBAL") { throw "version resource missing" }

      - name: Engine smoke test
        shell: cmd
        run: |
          HyperSense64.exe --engine > engine.log 2>&1
          type engine.log
          findstr /C:"HYPERSENSEGLOBAL" engine.log >nul
          if errorlevel 1 (
            echo ::error::engine banner missing - the embedded scanner did not start
            exit /b 1
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperSense64-x64
          path: HyperSense64.exe
          if-no-files-found: error
